services:
  postgres:
    image: postgres:16
    container_name: magnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: magnet
      POSTGRES_USER: magnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnet -d magnet"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: