name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Test backend
        run: npm test -- --runInBand

      - name: Build backend
        run: npm run build

  python:
    name: Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: python-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Lint Python
        run: python -m ruff check .

      - name: Test Python
        run: python -m pytest

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

  docker:
    name: Docker Build and Scan
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - python
      - integration
      - security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'magnet-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'magnet-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Scan Python image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'magnet-python-service:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

  integration:
    name: NestJS FastAPI Integration
    runs-on: ubuntu-latest

    needs:
      - backend
      - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python-service/requirements.txt

      - name: Install Python dependencies
        working-directory: python-service
        run: python -m pip install -r requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start FastAPI
        working-directory: python-service
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/fastapi.log 2>&1 &
          echo $! > /tmp/fastapi.pid

      - name: Wait for FastAPI
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/openapi.json > /dev/null; then
              echo "FastAPI is ready"
              exit 0
            fi
            sleep 1
          done

          echo "FastAPI failed to start"
          cat /tmp/fastapi.log
          exit 1

      - name: Run NestJS FastAPI integration test
        working-directory: backend
        run: npm run test:e2e -- --runInBand test/jobs.integration.e2e-spec.ts

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color